[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "srt_gmlm_icassp_exps"
version = "0.0.1"
description = "Experiments on Sparse and Low-Tucker Rank Generalized Multi-Linear Model"
authors = [
  { name = "Mert Indibi" },
]
license = { file = "LICENSE" }
readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License"
]
dependencies = [
    "black",
    "flake8",
    "isort",
    "loguru",
    "mkdocs",
    "pip",
    "python-dotenv",
    "tqdm",
    "typer",
    "t-regs",
    "mne[hdf]==1.12.1",
    "optuna==4.8.0",
    "optuna-integration==4.8.0",
    "omegaconf==2.3.0",
    "wandb==0.25.1",
    "scikit-learn==1.8.0",
    "scipy==1.17.1",
]
requires-python = "==3.13.12"

[tool.uv.sources]
t-regs = { git = "https://github.com/indibi/t-regs.git", rev = "srt_gmlm_icassp" }

[tool.black]
line-length = 99
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.venv
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["srt_gmlm_icassp_exps"]
force_sort_within_sections = true


