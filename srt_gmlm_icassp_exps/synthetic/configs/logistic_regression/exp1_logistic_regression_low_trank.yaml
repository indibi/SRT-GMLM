experiment_header:
  project_name: 'tensor_regression'
  group_name: 'logistic_regression'
  config_name: 'exp1_logistic_regression_low_trank'
  experiment_name: 'exp1_logistic_regression_low_trank'
  results_dir: ???  
  storage: sqlite:///${.results_dir}/${.group_name}.db
  tags: ['logistic_regression', 'tucker_rank', 'low_trank']
  notes: |
    # Experiment 1:
    ## Low Tucker Rank Regression Models

    ## Questions:
    * Question 1:
      Does Low-tucker rank logistic regression model with Riemannian Block
      Coordinate Descent model perform better with less samples than
      ridge regression model?
experiment_config:
  independent_variable:
    name: num_samples
    range: [100, 200, 400, 800, 1600, 3200, 6400, 12800, 25600]
    variable_to_cfg_keys:
      num_samples: 
        - data.n_train


  # Synthetic data configuration
  data:
    regression_type: 'logistic'
    tensor_type: 'low_tucker_rank'
    dims: [30,30,30]
    ranks: [3,3,3]
    n_train: ???
    seed: ${seed}
    dtype: 'double'
    factor_graphs: [null, null, null]
  models:
    # Logistic ridge regression model
    logistic_ridge:
      name: LogisticRidge
      algorithm: LogisticRidge
      hp_study_cfg: null
      model_cfg: null
    # Logistic Low Tucker Rank Tensor Regression
    lr_tucker:
      name: LowTuckerRank
      algorithm: TuckerRegressorBCD
      model_cfg:
        regressor:
          regression_type: 'logistic'
          feature_dims: '${experiment_config.data.dims}'
          feature_ranks: [3,3,3]
          feature_manifolds:
            - '${Steifel:${..feature_dims[0]}, ${..feature_ranks[0]}, ${...device}}'
            - '${Steifel:${..feature_dims[1]}, ${..feature_ranks[1]}, ${...device}}'
            - '${Steifel:${..feature_dims[2]}, ${..feature_ranks[2]}, ${...device}}'
        tau: 0.0
        ldas: [0.0, 0.0, 0.0]
        lda_core: 0.0
        thetas: [0.0, 0.0, 0.0]
        Ds: null
        Ls: [null, null, null]
        subproblem_solvers:
          U_1: '${init_rada_rgd:${misc.rada_rgd_cfg},${..ldas[0]},${mul:${experiment_config.data.dims[0]},${..regressor.feature_ranks[0]}}}'
          U_2: '${init_rada_rgd:${misc.rada_rgd_cfg},${..ldas[1]},${mul:${experiment_config.data.dims[1]},${..regressor.feature_ranks[1]}}}'
          U_3: '${init_rada_rgd:${misc.rada_rgd_cfg},${..ldas[2]},${mul:${experiment_config.data.dims[2]},${..regressor.feature_ranks[2]}}}'
          C: '${init_rada_rgd:${misc.rada_rgd_cfg},${..lda_core},${mul_list:${..regressor.feature_ranks}}}'
        dataloader_cfg: null
        main_algorithm: 'BCD_RADA_RGD'
        verbosity: 0
        init_with_hosvd_of_grad: true
        max_it: 50
        max_time: 32132123132132
        min_gradient_norm: 1.0e-5
        device: 'cuda'
      hp_study_cfg: null
        # directions: ['maximize']
        # sampler: '${GridSampler: ${oc.create:${.sampler_cfg}}}'
        # pruner: null
        # objective_config:
        #   objective_names:
        #     - 'val_accuracy'
        #   distributions:
        #     trank:
        #       type: int # 'int' | 'float' | 'categorical'
        #       kwargs:
        #         low: 1
        #         high: 8
        #         log: false
        #         step: 1
        #   split:
        #     type: 'k-fold'
        #     n_splits: 4
        #   hp_to_model_cfg_keys:
        #     trank:
        #       - regressor.feature_ranks[0]
        #       - regressor.feature_ranks[1]
        #       - regressor.feature_ranks[2]
        # sampler_cfg:
        #   search_space:
        #     trank: [1, 2, 3, 4, 5, 6]
        #   seed: 1
        # n_trials: 48
        # pruner_cfg: null
misc:
  TWO: 2
  rada_rgd_cfg:
    R: ??? # lda*(dim)**0.5 if lda!=0 else 1e-6*(dim)**0.5
    c1: 1.0e-1
    max_it: 400
    Tk: 5
    max_line_search: 25
    beta1: ??? # 0.01*(dim)**0.5,
    rho: 2.0
    tau_1: 0.999
    tau_2: 0.9
